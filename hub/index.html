<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<title>Sourced. Hub</title>
<link rel="icon" href="/media/favicon-32.png">
<link rel="apple-touch-icon" href="/media/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f2;--surface:#fff;--surface-2:#fafaf9;--sunken:#efefec;--border:#e6e6e2;--border-strong:#d4d4cf;
  --ink:#0b0b0b;--ink-2:#55554f;--ink-3:#8b8b84;--accent:#0b0b0b;--on-accent:#fff;
  --track:#ececE8;--bar:#0b0b0b;--bar-muted:#c9c9c3;
  --good:#16794a;--good-bg:#e7f5ed;--warn:#9a6500;--warn-bg:#fdf3dc;--bad:#c2312f;--bad-bg:#fdecea;--info:#2c4fbf;--info-bg:#eaeffc;
  --shadow:0 1px 2px rgba(10,10,10,.04),0 1px 1px rgba(10,10,10,.03);--shadow-lg:0 24px 60px -12px rgba(10,10,10,.22),0 2px 6px rgba(10,10,10,.06);
  --r-lg:18px;--r:12px;--r-sm:9px;
  --font:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,monospace;--display:Anton,'Arial Narrow',Impact,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0a0a;--surface:#141414;--surface-2:#181818;--sunken:#1d1d1d;--border:#242424;--border-strong:#333;
  --ink:#f3f3f1;--ink-2:#a6a6a0;--ink-3:#73736e;--accent:#f3f3f1;--on-accent:#0a0a0a;--track:#222;--bar:#f3f3f1;--bar-muted:#3a3a3a;
  --good:#4fd18b;--good-bg:#0f2a1c;--warn:#f0b43c;--warn-bg:#2b2210;--bad:#ff7b72;--bad-bg:#311515;--info:#8aa6ff;--info-bg:#172040;
  --shadow:0 1px 0 rgba(255,255,255,.02);--shadow-lg:0 24px 60px -12px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0a0a;--surface:#141414;--surface-2:#181818;--sunken:#1d1d1d;--border:#242424;--border-strong:#333;
  --ink:#f3f3f1;--ink-2:#a6a6a0;--ink-3:#73736e;--accent:#f3f3f1;--on-accent:#0a0a0a;--track:#222;--bar:#f3f3f1;--bar-muted:#3a3a3a;
  --good:#4fd18b;--good-bg:#0f2a1c;--warn:#f0b43c;--warn-bg:#2b2210;--bad:#ff7b72;--bad-bg:#311515;--info:#8aa6ff;--info-bg:#172040;
  --shadow:0 1px 0 rgba(255,255,255,.02);--shadow-lg:0 24px 60px -12px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.brand{font-family:var(--display);font-size:26px;line-height:1;letter-spacing:.01em}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;box-shadow:var(--shadow);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--border-strong);background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--sunken)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.icon{width:36px;padding:0}
.btn:disabled{opacity:.45;cursor:default}
.input,select.input,textarea.input{width:100%;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.55}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
label.lbl{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin:0 0 6px}
.field{margin-bottom:14px}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--sunken);gap:2px}
.seg button{height:30px;padding:0 12px;border:0;border-radius:8px;background:transparent;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow),0 0 0 1px var(--border)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.plain::before{display:none}
.st-new{background:var(--info-bg);color:var(--info)}.st-quoted{background:var(--warn-bg);color:var(--warn)}
.st-won,.st-sent{background:var(--good-bg);color:var(--good)}.st-done{background:var(--sunken);color:var(--ink)}
.st-lost,.st-failed{background:var(--bad-bg);color:var(--bad)}.st-sending{background:var(--warn-bg);color:var(--warn)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;margin-left:auto}

/* login */
#login{min-height:100%;display:grid;place-items:center;padding:24px;background:
  radial-gradient(900px 500px at 50% -10%,color-mix(in srgb,var(--ink) 6%,transparent),transparent 70%),var(--bg)}
.auth{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:32px;box-shadow:var(--shadow-lg)}
.auth .mark{width:52px;height:52px;border-radius:15px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--display);font-size:26px;margin-bottom:20px}
.auth h1{font-size:22px;margin:0 0 4px;font-weight:600;letter-spacing:-.02em}
.auth p{margin:0 0 22px}
.auth .err{color:var(--bad);font-size:13px;min-height:20px;margin-top:10px}
.auth .foot{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);font-size:12.5px;display:flex;justify-content:space-between}

/* shell */
#app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
aside.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 14px;border-right:1px solid var(--border);background:var(--bg)}
.side .head{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.side .head .tag{font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--sunken);border-radius:6px;padding:2px 7px;letter-spacing:.02em}
.search{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px 0 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--ink-3);cursor:pointer;width:100%;text-align:left;box-shadow:var(--shadow);margin-bottom:10px}
.search span{flex:1}
kbd{font:500 11px var(--mono);padding:2px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2)}
.navlbl{font-size:11.5px;font-weight:600;color:var(--ink-3);padding:12px 10px 6px;letter-spacing:.03em;text-transform:uppercase}
nav.main a{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:500}
nav.main a:hover{background:var(--sunken);color:var(--ink)}
nav.main a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow),0 0 0 1px var(--border)}
.side .grow{flex:1}
.goal{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:14px;margin:8px 0;box-shadow:var(--shadow)}
.goal .t{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.goal b{font-size:20px;font-weight:600;letter-spacing:-.02em;display:block;margin-bottom:10px}
.meter{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--bar);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.acct{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px}
.acct .av{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:600}
.acct .who{flex:1;min-width:0;line-height:1.3}.acct .who b{font-weight:600;display:block}.acct .who span{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

main.page{min-width:0;padding:22px 32px 48px}
.topbar{display:flex;align-items:center;gap:12px;margin:0 0 22px;min-height:40px}
.topbar h1{font-size:24px;font-weight:600;letter-spacing:-.025em;margin:0}
.topbar .sub{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.topbar .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#menuBtn{display:none}

/* cards */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0}
.card .ch{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.card .ch h3{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.card .ch .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card .cb{padding:16px 18px 18px}
.stat{padding:16px 18px}
.stat .k{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px;font-weight:500}
.stat .k .ico{width:28px;height:28px;border-radius:9px;background:var(--sunken);display:grid;place-items:center;color:var(--ink)}
.stat .k .ico svg{width:15px;height:15px}
.stat .v{font-size:28px;font-weight:600;letter-spacing:-.03em;margin:12px 0 4px;line-height:1.1}
.stat .s{font-size:12.5px;color:var(--ink-3)}
.stat .meter{margin-top:12px;height:6px}
.empty{padding:36px 16px;text-align:center;color:var(--ink-3)}
.skel{background:linear-gradient(90deg,var(--sunken),var(--surface-2),var(--sunken));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;height:14px}
@keyframes sk{to{background-position:-200% 0}}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid-l{stroke:var(--border);stroke-width:1}
.chart .ax{fill:var(--ink-3);font:11px var(--font)}
.chart .b{fill:var(--bar);transition:opacity .15s}
.chart .b.dim{opacity:.28}
.chart .hit{fill:transparent;cursor:default}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:9px;padding:7px 10px;font-size:12px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;box-shadow:var(--shadow-lg);z-index:3}
.tip b{font-weight:600;font-size:13px}
.headline{display:flex;align-items:baseline;gap:10px;margin:2px 0 12px}
.headline b{font-size:26px;font-weight:600;letter-spacing:-.03em}

/* stage bars */
.stages{display:flex;flex-direction:column;gap:12px}
.stage .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.stage .row b{font-weight:600}
.stage .meter{height:10px}
.stage.lost .meter i{background:var(--bar-muted)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--border);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.av-s{width:34px;height:34px;border-radius:10px;background:var(--sunken);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;color:var(--ink)}
.li .m{flex:1;min-width:0;line-height:1.35}
.li .m b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m span{color:var(--ink-3);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert{display:flex;gap:12px;padding:12px 18px;border-top:1px solid var(--border)}
.alert:first-child{border-top:0}
.alert .dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.alert .dot svg{width:15px;height:15px}
.alert b{font-weight:600;display:block}
.alert span{font-size:12.5px;color:var(--ink-2)}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .q{position:relative;flex:1;min-width:200px;max-width:340px}
.toolbar .q svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--ink-3)}
.toolbar .q input{padding-left:34px}
.toolbar .sp{flex:1}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--sunken);border-radius:var(--r-lg);padding:10px;min-height:200px;transition:background .15s,box-shadow .15s}
.col.over{box-shadow:inset 0 0 0 2px var(--ink)}
.col .h{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:600}
.col .h .n{color:var(--ink-3);font-weight:500}
.col .h .sum{margin-left:auto;font-size:12px;color:var(--ink-2);font-weight:500}
.kc{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:12px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.kc:hover{box-shadow:var(--shadow),0 0 0 1px var(--border-strong)}
.kc.dragging{opacity:.4}
.kc .t{font-weight:600;line-height:1.3;margin-bottom:2px}
.kc .c{font-size:12.5px;color:var(--ink-2);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kc .f{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.kc .f .money{margin-left:auto;color:var(--ink);font-weight:600}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:var(--sunken);font-size:11.5px;color:var(--ink-2);font-weight:500}

/* table */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
.tbl th:first-child{border-top-left-radius:var(--r-lg)}.tbl th:last-child{border-top-right-radius:var(--r-lg)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .who{display:flex;align-items:center;gap:10px;min-width:180px}
.tbl .who b{font-weight:600;display:block;line-height:1.3}
.tbl .who span{font-size:12px;color:var(--ink-3)}
.tbl .clip{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .r{text-align:right}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--border);font-size:13px;color:var(--ink-2)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.32);backdrop-filter:blur(2px);z-index:40;animation:fade .2s}
.drawer{position:fixed;top:10px;right:10px;bottom:10px;width:min(520px,calc(100vw - 20px));background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-lg);z-index:41;display:flex;flex-direction:column;animation:slide .25s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer .dh{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 14px;border-bottom:1px solid var(--border)}
.drawer .dh h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.drawer .dh .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.drawer .db{flex:1;overflow:auto;padding:18px}
.drawer .df{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:110px 1fr;gap:9px 14px;font-size:13.5px;margin:0 0 18px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.box{border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:16px;background:var(--surface-2)}
.box h4{margin:0 0 10px;font-size:13px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg.wrap{flex-wrap:wrap}
details.tx summary{cursor:pointer;font-weight:500;color:var(--ink-2);font-size:13px}
details.tx pre{white-space:pre-wrap;font:12.5px/1.55 var(--mono);background:var(--sunken);padding:12px;border-radius:10px;max-height:260px;overflow:auto}

/* tabs inside page */
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.ptabs button{height:40px;padding:0 4px;margin-right:16px;border:0;background:none;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.ptabs .cnt{font-size:11.5px;color:var(--ink-3);background:var(--sunken);border-radius:99px;padding:1px 7px}

.tpl{display:flex;flex-direction:column}
.tpl .cb{flex:1;display:flex;flex-direction:column}
.tpl .sj{font-weight:600;margin-bottom:8px;line-height:1.35}
.tpl .bd{font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;max-height:150px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent);flex:1}
.compose{max-width:760px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);font-size:13px;margin-bottom:16px}
.note svg{width:16px;height:16px;margin-top:2px;flex:none}

/* website */
.frame-wrap{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);box-shadow:var(--shadow);height:calc(100vh - 210px);min-height:520px}
.frame-wrap iframe{display:block;width:100%;height:100%;border:0;background:#000}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pages a{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;text-decoration:none;background:var(--surface);font-weight:500;box-shadow:var(--shadow)}
.pages a:hover{border-color:var(--border-strong)}
.pages a span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pages a svg{width:15px;height:15px;color:var(--ink-3)}

/* palette */
.pal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);z-index:61;overflow:hidden;animation:fade .15s}
.pal input{width:100%;height:54px;border:0;border-bottom:1px solid var(--border);padding:0 18px;font-size:15px;outline:none;background:transparent}
.pal .res{max-height:52vh;overflow:auto;padding:6px}
.pal .grp{font-size:11.5px;font-weight:600;color:var(--ink-3);padding:10px 12px 4px;text-transform:uppercase;letter-spacing:.03em}
.pal .it{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer}
.pal .it[aria-selected="true"]{background:var(--sunken)}
.pal .it span{color:var(--ink-3);font-size:12.5px;margin-left:auto}
#palScrim{z-index:60}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:500;box-shadow:var(--shadow-lg);z-index:80;max-width:calc(100vw - 32px);animation:fade .2s}
#toast.bad{background:var(--bad);color:#fff}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g-main{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  aside.side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:50;transform:translateX(-110%);transition:transform .25s;background:var(--bg);visibility:hidden}
  body.nav-open aside.side{transform:none;visibility:visible;box-shadow:var(--shadow-lg)}
  .topbar{flex-wrap:wrap;align-items:flex-start}
  .topbar>div:nth-child(2){flex:1;min-width:0}
  .topbar .acts{margin-left:0;width:100%}
  .topbar .acts .btn{flex:1}
  body.nav-open #navScrim{display:block}
  #menuBtn{display:inline-flex}
  main.page{padding:14px 16px 40px}
  .topbar h1{font-size:20px}
  .g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr}
  .stat .v{font-size:24px}
  .frame-wrap{height:calc(100vh - 190px)}
  .kv{grid-template-columns:96px 1fr}
}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.stat{padding:14px}.toolbar .q{max-width:none;min-width:100%}.two{grid-template-columns:1fr}}
/* calendar */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.calhead h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em;min-width:150px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--border);gap:1px;box-shadow:var(--shadow)}
.cal .dow{background:var(--surface-2);padding:9px 10px;font-size:12px;font-weight:500;color:var(--ink-3)}
.cal .day{background:var(--surface);min-height:112px;padding:7px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.out{background:var(--surface-2)}.cal .day.out .dn{color:var(--ink-3)}
.cal .dn{font-size:12.5px;font-weight:500;width:24px;height:24px;display:grid;place-items:center;border-radius:7px;margin-bottom:2px}
.cal .day.today .dn{background:var(--accent);color:var(--on-accent)}
.ev{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:3px 7px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.45}
.ev.st-done{background:var(--sunken);color:var(--ink)}
.more{font-size:11.5px;color:var(--ink-3);padding:0 6px}
.agenda .li .when{width:74px;flex:none;line-height:1.25}
.agenda .li .when b{display:block;font-size:15px;font-weight:600}
.agenda .li .when span{font-size:11.5px;color:var(--ink-3);text-transform:uppercase}
.copy{display:flex;gap:8px}.copy input{font:12.5px var(--mono)}
@media (max-width:760px){.cal{display:none}}
@media (min-width:761px){.cal-mobile-only{display:none}}
/* inbox */
.inbox{display:grid;grid-template-columns:330px minmax(0,1fr);height:calc(100vh - 128px);min-height:520px;overflow:hidden;padding:0}
.th-list{border-right:1px solid var(--border);overflow:auto;display:flex;flex-direction:column}
.th-list .li{padding:12px 16px}
.th-list .li[aria-current="true"]{background:var(--sunken)}
.th-list .li .m b{display:flex;gap:6px;align-items:center}
.th-list .ur{min-width:20px;height:20px;border-radius:99px;background:var(--good);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.chat .chd{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.chat .chd .m{flex:1;min-width:0;line-height:1.3}.chat .chd .m b{font-weight:600;display:block}.chat .chd .m span{font-size:12.5px;color:var(--ink-3)}
.msgs{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.msg{max-width:min(72%,520px);padding:8px 12px 6px;border-radius:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow)}
.msg.in{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px}
.msg.out{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:5px}
.msg .t{font-size:11px;opacity:.6;margin-top:3px;text-align:right}
.msg .k{font-size:12px;opacity:.75;font-weight:500}
.msg a{color:inherit}
.dsep{align-self:center;font-size:11.5px;color:var(--ink-3);background:var(--sunken);border-radius:99px;padding:2px 10px;margin:8px 0}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);align-items:flex-end}
.composer textarea{flex:1;min-height:42px;max-height:160px;resize:none}
.warn{font-size:12.5px;color:var(--warn);background:var(--warn-bg);padding:8px 14px}
.setup ol{margin:0;padding-left:20px;line-height:1.75}
.setup li{margin-bottom:6px}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
.chk .d{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none}
.chk .d svg{width:12px;height:12px;stroke-width:2.6}
@media (max-width:860px){.inbox{grid-template-columns:1fr;height:calc(100vh - 170px)}.inbox.open .th-list{display:none}.inbox:not(.open) .chat{display:none}.msg{max-width:85%}}
#navScrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:49}
@media (forced-colors:active){.meter i,.chart .b{background:CanvasText;fill:CanvasText}}
</style>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ico = (n, cls = 'i') => `<svg class="${cls}"><use href="#i-${n}"/></svg>`;
const gbp = n => '£' + Math.round(n || 0).toLocaleString('en-GB');
const WEEK_TARGET = 1000, MIN_COMMISSION = 300;
const ST = { new: 'New', quoted: 'Quoted', won: 'Won', done: 'Job done', lost: 'Lost' };
const ORDER = ['new', 'quoted', 'won', 'done', 'lost'];
const S = { enq: [], out: null, leadView: localStorage.getItem('hub.leadView') || 'board', leadQ: '', leadSrc: 'all', outTab: 'sent', outQ: '', webTab: 'edit', sentPage: 0, loaded: false };
const isPartner = e => /^partner/i.test(e.source || '');
const leads = () => S.enq.filter(e => !isPartner(e));
const partners = () => S.enq.filter(isPartner);
const key = e => (e.at || '') + '|' + (e.email || e.phone || e.name || '');

function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, bad ? 6000 : 2800); }
async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  let d = {}; try { d = await r.json(); } catch (_) {}
  if (r.status === 401) { showLogin(); throw new Error(d.error || 'Please sign in again.'); }
  if (!r.ok) throw new Error(d.error || 'Something went wrong (' + r.status + ')');
  return d;
}
function ago(t) {
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 86400 * 7) return Math.floor(s / 86400) + 'd ago';
  return new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
const fmt = t => { try { return new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (_) { return t; } };
const initials = s => (String(s || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('') || '?').toUpperCase();
const nameOf = e => e.name || e.company || e.email || e.phone || 'Website visitor';
const srcLabel = e => e.private ? (e.platform || 'Private') : /amelia/i.test(e.source || '') ? 'Amelia' : 'Form';
const needOf = e => e.categories || e.items || e.summary || (e.details || '').slice(0, 120) || e.offer || '';
function weekStart() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }

/* ---------------- theme ---------------- */
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#themeBtn').innerHTML = ico(dark ? 'sun' : 'moon');
}
let theme = (() => { try { return localStorage.getItem('hub.theme') || 'system'; } catch (_) { return 'system'; } })();
applyTheme(theme);
$('#themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  theme = dark ? 'light' : 'dark'; try { localStorage.setItem('hub.theme', theme); } catch (_) {} applyTheme(theme);
});

/* ---------------- auth ---------------- */
function showLogin() { $('#app').hidden = true; $('#login').hidden = false; setTimeout(() => $('#pw').focus(), 40); }
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#loginErr').textContent = ''; $('#loginBtn').disabled = true;
  try { await api('/api/hub?task=login', { method: 'POST', body: { password: $('#pw').value } }); $('#pw').value = ''; S.icalKey = (await api('/api/hub?task=session')).icalKey; start(); }
  catch (er) { $('#loginErr').textContent = er.message; }
  $('#loginBtn').disabled = false;
});
async function logout() { await api('/api/hub?task=login', { method: 'DELETE' }).catch(() => {}); location.hash = ''; location.reload(); }

async function boot() {
  try { const s = await api('/api/hub?task=session'); if (!s.loggedIn) return showLogin(); S.icalKey = s.icalKey; start(); }
  catch (e) { showLogin(); $('#loginErr').textContent = e.message; }
}
async function start() {
  $('#login').hidden = true; $('#app').hidden = false;
  route();
  await Promise.all([loadEnq(), loadOut(), loadWa()]);
  S.loaded = true; route();
  setInterval(() => { if (!document.hidden && S.wa?.ready && cur() !== 'inbox') loadThreads(true); }, 60000);
  setInterval(() => { if (!document.hidden) loadEnq(true).then(() => { if (['overview', 'leads', 'partners', 'calendar'].includes(cur())) render(); }); }, 60000);
}
async function loadEnq(quiet) {
  try { S.enq = (await api('/api/enquiry')).enquiries || []; S.enqErr = null; }
  catch (e) { S.enqErr = e.message; if (!quiet) toast(e.message, true); }
  sideStats();
}
async function loadOut(quiet) {
  try { S.out = await api('/api/hub?task=outreach'); S.outErr = null; }
  catch (e) { S.outErr = e.message; if (!quiet) toast(e.message, true); }
}

/* ---------------- metrics ---------------- */
function metrics() {
  const ws = weekStart(), inW = t => t && new Date(t) >= ws;
  const L = leads();
  const wonW = L.filter(e => (e.status === 'won' || e.status === 'done') && inW(e.wonAt));
  const comm = wonW.reduce((a, e) => a + (e.commission || 0), 0);
  const open = L.filter(e => e.status === 'quoted');
  const d7 = Date.now() - 7 * 864e5;
  return {
    comm, wonW, pct: Math.min(100, Math.round(comm / WEEK_TARGET * 100)),
    open, openComm: open.reduce((a, e) => a + (e.commission || 0), 0),
    new7: L.filter(e => new Date(e.at) >= d7).length,
    newCount: L.filter(e => (e.status || 'new') === 'new').length,
    stale: L.filter(e => (e.status || 'new') === 'new' && Date.now() - new Date(e.at) > 864e5),
    quotedW: L.filter(e => inW(e.quotedAt)).length,
    needJobs: Math.max(0, Math.ceil(WEEK_TARGET / MIN_COMMISSION) - wonW.length)
  };
}
function sideStats() {
  const m = metrics();
  $('#sgVal').innerHTML = `${gbp(m.comm)} <span class="faint" style="font-size:13px;font-weight:500">/ ${gbp(WEEK_TARGET)}</span>`;
  $('#sgPct').textContent = m.pct + '%'; $('#sgBar').style.width = m.pct + '%';
  $('#navNew').hidden = !m.newCount; $('#navNew').textContent = m.newCount;
  const p = partners().filter(e => Date.now() - new Date(e.at) < 7 * 864e5).length;
  $('#navPartners').hidden = !p; $('#navPartners').textContent = p;
}

function barChart(el, data) {
  const W = Math.max(280, Math.round(el.clientWidth || 640)), H = 220, pl = 34, pr = 6, pt = 10, pb = 26;
  const max = Math.max(4, ...data.map(d => d.v));
  const nice = (() => { const st = Math.pow(10, Math.floor(Math.log10(max))); const m = max / st; return (m <= 2 ? 2 : m <= 5 ? 5 : 10) * st; })();
  const iw = W - pl - pr, ih = H - pt - pb, n = data.length, slot = iw / n, bw = Math.min(26, slot * .56);
  const y = v => pt + ih - v / nice * ih;
  const lab = d => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Outreach emails sent per day, last 14 days">`;
  for (let i = 0; i <= 4; i++) { const v = nice / 4 * i, yy = y(v); s += `<line class="grid-l" x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}"/><text class="ax" x="${pl - 8}" y="${yy + 4}" text-anchor="end">${Math.round(v)}</text>`; }
  data.forEach((d, i) => {
    const x = pl + slot * i + (slot - bw) / 2, h = Math.max(d.v ? 2 : 0, ih - (y(d.v) - pt)), top = pt + ih - h, r = Math.min(4, bw / 2, h);
    if (h > 0) s += `<path class="b" data-i="${i}" d="M${x},${pt + ih} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r} V${pt + ih} Z"/>`;
    if ((n - 1 - i) % (W < 480 ? 3 : 2) === 0) s += `<text class="ax" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${lab(d.label)}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${pl + slot * i}" y="${pt}" width="${slot}" height="${ih}"/>`;
  });
  el.innerHTML = s + '</svg><div class="tip" hidden></div>';
  const tip = el.querySelector('.tip'), svg = el.querySelector('svg');
  el.querySelectorAll('.hit').forEach(h => {
    const show = () => {
      const i = +h.dataset.i, d = data[i], box = svg.getBoundingClientRect(), sx = box.width / W, sy = box.height / H;
      el.querySelectorAll('.b').forEach(b => b.classList.toggle('dim', b.dataset.i != i));
      tip.hidden = false; tip.innerHTML = `<div>${new Date(d.label + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}</div><b>${d.v} new</b> · ${d.f} follow-up${d.f === 1 ? '' : 's'}`;
      tip.style.left = ((pl + slot * i + slot / 2) * sx) + 'px'; tip.style.top = (y(d.v) * sy) + 'px';
    };
    h.addEventListener('mouseenter', show); h.addEventListener('touchstart', show, { passive: true });
  });
  el.addEventListener('mouseleave', () => { tip.hidden = true; el.querySelectorAll('.b').forEach(b => b.classList.remove('dim')); });
}

/* ---------------- leads ---------------- */
function filteredLeads(list = leads()) {
  const q = S.leadQ.trim().toLowerCase();
  return list.filter(e => {
    if (S.leadSrc === 'amelia' && !/amelia/i.test(e.source || '')) return false;
    if (S.leadSrc === 'form' && (/amelia/i.test(e.source || '') || e.private)) return false;
    if (S.leadSrc === 'social' && !e.private) return false;
    if (!q) return true;
    return ['name', 'company', 'handle', 'platform', 'email', 'phone', 'categories', 'items', 'details', 'summary', 'location', 'note'].some(k => String(e[k] || '').toLowerCase().includes(q));
  }).sort((a, b) => (b.at || '').localeCompare(a.at || ''));
}
function renderLeads() {

function leadBody() {
  const el = $('#leadBody'); if (!el) return;
  if (!S.loaded) { el.innerHTML = `<div class="card cb">${skel(6)}</div>`; return; }
  if (S.enqErr && !S.enq.length) { el.innerHTML = `<div class="card empty">${esc(S.enqErr)}</div>`; return; }
  const L = filteredLeads();
  if (S.leadView === 'table') { el.innerHTML = leadTable(L); bindRows(el); return; }
  el.innerHTML = `<div class="board">${ORDER.map(s => {
    const items = L.filter(e => (e.status || 'new') === s);
    const sum = items.reduce((a, e) => a + (e.commission || 0), 0);
    return `<div class="col" data-col="${s}"><div class="h"><span class="pill st-${s}">${ST[s]}</span><span class="n">${items.length}</span>${sum ? `<span class="sum num">${gbp(sum)}</span>` : ''}</div>
      ${items.map(e => `<div class="kc" draggable="true" data-k="${esc(key(e))}" tabindex="0">

        <div class="f">${e.shootStart ? `<span class="tag">${esc(rangeLabel(e.shootStart, e.shootEnd))}</span>` : e.date ? `<span class="tag">${esc(String(e.date).slice(0, 24))}</span>` : ''}<span>${esc(srcLabel(e))} · ${ago(e.at)}</span>${e.commission ? `<span class="money num">${gbp(e.commission)}</span>` : e.value ? `<span class="money num">${gbp(e.value)} job</span>` : ''}</div>
      </div>`).join('') || '<div class="faint" style="font-size:12.5px;padding:8px 6px">Nothing here</div>'}</div>`;
  }).join('')}</div>`;
  el.querySelectorAll('.kc').forEach(c => {
    c.addEventListener('click', () => openLead(c.dataset.k));
    c.addEventListener('keydown', ev => { if (ev.key === 'Enter') openLead(c.dataset.k); });
    c.addEventListener('dragstart', ev => { ev.dataTransfer.setData('text/plain', c.dataset.k); c.classList.add('dragging'); });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
  });
  el.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', ev => { ev.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', async ev => {
      ev.preventDefault(); col.classList.remove('over');
      const k = ev.dataTransfer.getData('text/plain'), e = S.enq.find(x => key(x) === k);
      if (!e || (e.status || 'new') === col.dataset.col) return;
      await patchLead(e, { status: col.dataset.col }, `Moved to ${ST[col.dataset.col]}`);

  });

function bindRows(el) { el.querySelectorAll('tr[data-k]').forEach(r => r.addEventListener('click', () => openLead(r.dataset.k))); }

async function patchLead(e, body, msg) {
  try {
    await api('/api/enquiry', { method: 'PATCH', body: { url: e.url, ...body } });
    const k = key(e); await loadEnq(); render(); toast(msg || 'Saved');
    return S.enq.find(x => key(x) === k);
  } catch (er) { toast(er.message, true); }
}

  $('#abSave').onclick = async () => {
    const body = { platform: plat, status: stage, name: v('abName'), handle: v('abHandle'), company: v('abCo'), phone: v('abPhone'), email: v('abEmail'),
      categories: v('abNeeds'), shootStart: v('abS'), shootEnd: v('abE'), date: rangeLabel(v('abS'), v('abE')), location: v('abLoc'), details: v('abDetails'), value: v('abVal'), commission: v('abCom'),
      note: v('abNote'), received: v('abRec'), chase: $('#abChase').checked };
    if (!body.name && !body.handle && !body.email && !body.phone) { $('#abErr').textContent = 'Add at least a name, handle, email or phone.'; return; }
    $('#abSave').disabled = true;
    try {
      await api('/api/hub?task=addlead', { method: 'POST', body });
      closeDrawer(); await loadEnq(); render(); toast(`Added ${body.name || body.handle} to ${ST[stage]}`);
    } catch (e) { $('#abErr').textContent = e.message; $('#abSave').disabled = false; }
  };
}

/* ---------------- outreach ---------------- */
function renderOutreach() {
  const sub = location.hash.split('/')[1]; if (['sent', 'queue', 'templates', 'compose', 'lists'].includes(sub)) S.outTab = sub;
  $('#pgSub').textContent = S.out?.sender ? `Sending as ${S.out.sender} · replies go to ${S.out.replyTo.join(', ')}` : 'Cold outreach, follow-ups and one-off emails from your Sourced. address.';
  acts(`<button class="btn" id="rf">${ico('refresh')}Refresh</button><button class="btn primary" id="cmp">${ico('send')}Compose</button>`);
  $('#rf').onclick = async () => { await loadOut(); render(); toast('Up to date'); };
  $('#cmp').onclick = () => { location.hash = '#outreach/compose'; };
  if (!S.out) { $('#view').innerHTML = S.outErr ? `<div class="card empty">${esc(S.outErr)}</div>` : `<div class="grid g5">${Array(5).fill('<div class="card stat">' + skel(2) + '</div>').join('')}</div>`; return; }
  const o = S.out.stats, n = v => Number(v || 0).toLocaleString('en-GB');
  $('#view').innerHTML = `
    <div class="grid g5" style="margin-bottom:20px">
      <div class="card stat"><div class="k">Waiting to send</div><div class="v num">${n(o.waiting)}</div><div class="s">${n(o.queued)} queued in total</div></div>
      <div class="card stat"><div class="k">Sent</div><div class="v num">${n(o.sentTotal)}</div><div class="s">${n(o.sent7)} in the last 7 days</div></div>
      <div class="card stat"><div class="k">Follow-ups</div><div class="v num">${n(o.followupsTotal)}</div><div class="s">${n(o.followupsDue)} due now</div></div>
      <div class="card stat"><div class="k">Replied</div><div class="v num">${n(o.replied)}</div><div class="s">${n(o.suppressed)} opted out</div></div>
      <div class="card stat"><div class="k">Failed</div><div class="v num">${n(o.failedRecent)}</div><div class="s">In the latest 150 sends</div></div>
    </div>
    <div class="ptabs" role="tablist">${[['sent', 'Sent log', S.out.recent.length], ['queue', 'Queue', o.waiting], ['templates', 'Templates', S.out.templates.length], ['compose', 'Compose'], ['lists', 'Replied & opted out', o.replied + o.suppressed]]
      .map(([k, l, c]) => `<button role="tab" data-t="${k}" aria-selected="${S.outTab === k}">${l}${c != null ? `<span class="cnt num">${n(c)}</span>` : ''}</button>`).join('')}</div>
    <div id="outBody"></div>`;
  $('#view').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { location.hash = '#outreach/' + b.dataset.t; });
  ({ sent: outSent, queue: outQueue, templates: outTemplates, compose: outCompose, lists: outLists })[S.outTab]();
}
const prettyKey = k => k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
function outSent() {
  const q = S.outQ.toLowerCase();
  const rows = S.out.recent.filter(r => !q || (r.to + ' ' + r.subject).toLowerCase().includes(q));
  const stepL = { first: 'First email', f1: 'Follow-up 1', f2: 'Follow-up 2', manual: 'One-off' };
  $('#outBody').innerHTML = `<div class="toolbar"><div class="q">${ico('search')}<input class="input" id="oq" placeholder="Search recipient or subject" value="${esc(S.outQ)}"></div></div>
    <div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Recipient</th><th>Subject</th><th>Type</th><th>Status</th><th>Sent</th></tr></thead><tbody>
    ${rows.length ? rows.map(r => `<tr title="${esc(r.detail)}"><td><div class="who"><span class="av-s">${esc(initials(r.to.split('@')[0].replace(/[._-]/g, ' ')))}</span><div><b>${esc(r.to.split('@')[0])}</b><span>@${esc(r.to.split('@')[1] || '')}</span></div></div></td>
      <td><div class="clip">${esc(r.subject)}</div></td><td class="faint" style="white-space:nowrap">${stepL[r.step] || r.step}</td>
      <td><span class="pill st-${esc(r.status)}">${esc(r.status[0].toUpperCase() + r.status.slice(1))}</span></td><td class="faint num" style="white-space:nowrap">${fmt(r.at)}</td></tr>`).join('') : '<tr><td colspan="5"><div class="empty">Nothing sent yet.</div></td></tr>'}
    </tbody></table></div>`;
  $('#oq').addEventListener('input', e => { S.outQ = e.target.value; const p = e.target.selectionStart; outSent(); const i = $('#oq'); i.focus(); i.setSelectionRange(p, p); });
}
function outQueue() {
  const u = S.out.upcoming;
  $('#outBody').innerHTML = `<div class="note">${ico('info')}<div>The sender goes out every 10 minutes, 5 at a time, so the queue drains by itself. New contacts are added by your daily outreach job.</div></div>
    <div class="card"><div class="list">${u.length ? u.map((m, i) => `<button class="li" data-i="${i}"><span class="av-s">${esc(initials(m.to.split('@')[0].replace(/[._-]/g, ' ')))}</span>
      <span class="m"><b>${esc(m.to)}</b><span>${esc(m.subject)}</span></span>${m.priority ? '<span class="pill st-new">Reply</span>' : ''}<span class="faint" style="font-size:12px">#${i + 1}</span></button>`).join('') : '<div class="empty">Queue is empty. Every queued email has gone out.</div>'}</div>
    ${S.out.stats.waiting > u.length ? `<div class="pager">Showing the next ${u.length} of ${S.out.stats.waiting.toLocaleString('en-GB')}</div>` : ''}</div>`;
  $('#outBody').querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
    const m = u[b.dataset.i];
    drawer(`<div class="dh"><div style="flex:1;min-width:0"><h2>${esc(m.subject)}</h2><div class="sub">To ${esc(m.to)} · position ${+b.dataset.i + 1} in the queue</div></div><button class="btn ghost icon" data-close aria-label="Close">${ico('x')}</button></div>
      <div class="db"><div style="white-space:pre-wrap;line-height:1.6">${esc(m.text)}</div></div>`);
  });
}
function outTemplates() {
  $('#outBody').innerHTML = `<div class="grid g3">${S.out.templates.map((t, i) => `<div class="card tpl"><div class="ch"><span class="tag">${esc(prettyKey(t.key))}</span></div>
    <div class="cb"><div class="sj">${esc(t.subject)}</div><div class="bd">${esc(t.text)}</div>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn sm" data-view="${i}">Read</button><button class="btn sm primary" data-use="${i}">Use in compose</button></div></div></div>`).join('')}</div>`;
  $('#outBody').querySelectorAll('[data-view]').forEach(b => b.onclick = () => { const t = S.out.templates[b.dataset.view];
    drawer(`<div class="dh"><div style="flex:1;min-width:0"><h2>${esc(t.subject)}</h2><div class="sub">${esc(prettyKey(t.key))} template · {name} is filled in per contact</div></div><button class="btn ghost icon" data-close aria-label="Close">${ico('x')}</button></div><div class="db"><div style="white-space:pre-wrap;line-height:1.6">${esc(t.text)}</div></div>`); });
  $('#outBody').querySelectorAll('[data-use]').forEach(b => b.onclick = () => { const t = S.out.templates[b.dataset.use]; S.draft = { to: '', subject: t.subject.replace(/\{name\}/g, ''), text: t.text.replace(/\{name\}/g, 'there') }; location.hash = '#outreach/compose'; });
}
function outCompose() {
  const d = S.draft || { to: '', subject: '', text: '\n\nBest,\n\nBenji\nSourced.\nSee it. Say it. Sourced.\nwww.wearesourced.co.uk | 07590 474421' };
  $('#outBody').innerHTML = `<div class="card compose"><div class="cb">
    <div class="note" style="margin-bottom:18px">${ico('info')}<div>Sends one email now from <b>${esc(S.out.sender || 'your Sourced. address')}</b>. Replies go to ${esc(S.out.replyTo.join(', '))}. It's logged in the sent log.</div></div>
    <div class="field"><label class="lbl" for="cTo">To</label><input class="input" id="cTo" type="email" placeholder="name@company.com" value="${esc(d.to)}"></div>
    <div class="field"><label class="lbl" for="cSub">Subject</label><input class="input" id="cSub" value="${esc(d.subject)}"></div>
    <div class="field"><label class="lbl" for="cTxt">Message</label><textarea class="input" id="cTxt" rows="14">${esc(d.text)}</textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="cClr">Clear</button><button class="btn primary" id="cSend">${ico('send')}Send email</button></div></div></div>`;
  const keep = () => { S.draft = { to: $('#cTo').value, subject: $('#cSub').value, text: $('#cTxt').value }; };
  ['#cTo', '#cSub', '#cTxt'].forEach(s => $(s).addEventListener('input', keep));
  $('#cClr').onclick = () => { S.draft = null; outCompose(); };
  $('#cSend').onclick = async () => {
    keep(); const b = $('#cSend');
    if (!confirm(`Send this email to ${S.draft.to}?`)) return;
    b.disabled = true;
    try { await api('/api/hub?task=send', { method: 'POST', body: S.draft }); toast('Sent to ' + S.draft.to); S.draft = null; await loadOut(true); location.hash = '#outreach/sent'; render(); }
    catch (e) { toast(e.message, true); b.disabled = false; }
  };
}
function outLists() {
  const box = (t, arr, s) => `<div class="card"><div class="ch"><h3>${t}</h3><div class="r faint">${arr.length}</div></div><div class="cb" style="padding:8px 0 4px"><div class="list">
    ${arr.length ? arr.map(a => `<div class="li" style="cursor:default"><span class="av-s">${esc(initials(String(a).replace(/[@._-]/g, ' ')))}</span><span class="m"><b>${esc(a)}</b><span>${s}</span></span></div>`).join('') : '<div class="empty">None</div>'}</div></div></div>`;
  $('#outBody').innerHTML = `<div class="note">${ico('info')}<div>Anyone here never gets automatic follow-ups. Opted-out addresses are never emailed again.</div></div><div class="grid g-main">${box('Replied', S.out.replied, 'Follow-ups stopped')}${box('Opted out', S.out.suppress, 'Never emailed')}</div>`;
}

function renderPartners() {

      ${P.map(e => `<tr data-k="${esc(key(e))}"><td><div class="who"><span class="av-s">${esc(initials(e.company || nameOf(e)))}</span><div><b>${esc(e.company || nameOf(e))}</b><span>${esc(e.email || e.phone || '')}</span></div></div></td>
        <td><div class="clip">${esc(e.offer || e.categories || e.details || '')}</div></td><td class="clip" style="max-width:160px">${esc(e.area || e.location || '–')}</td>
        <td>${e.onboarded ? '<span class="pill st-won">Sent</span>' : '<span class="pill st-quoted">Pending</span>'}</td><td class="faint num" style="white-space:nowrap">${fmt(e.at)}</td></tr>`).join('')}</tbody></table></div>`

/* ---------------- settings ---------------- */

    <div class="card"><div class="ch"><h3>Shortcuts</h3></div><div class="cb"><div class="pages">
      <a href="https://www.wearesourced.co.uk" target="_blank" rel="noopener">${ico('globe')}<span>Live website</span>${ico('ext')}</a>
      <a href="/admin/" target="_blank" rel="noopener">${ico('gear')}<span>Classic back end</span>${ico('ext')}</a>

/* ---------------- command palette ---------------- */
let palSel = 0, palItems = [];
function openPal() {
  closePal();
  const sc = document.createElement('div'); sc.className = 'scrim'; sc.id = 'palScrim'; sc.onclick = closePal;
  const p = document.createElement('div'); p.className = 'pal'; p.id = 'pal'; p.setAttribute('role', 'dialog');
  p.innerHTML = '<input id="palIn" placeholder="Jump to a page, or search briefs and partners…" autocomplete="off"><div class="res" id="palRes"></div>';
  document.body.append(sc, p); const i = $('#palIn'); i.focus(); i.addEventListener('input', palRender); i.addEventListener('keydown', palKey); palRender();
}
function closePal() { $('#pal')?.remove(); $('#palScrim')?.remove(); }
function palRender() {
  const q = $('#palIn').value.trim().toLowerCase();
  const nav = [...Object.entries(ROUTES).map(([k, r]) => ({ g: 'Go to', t: r.t, run: () => location.hash = '#' + k })),
    { g: 'Actions', t: 'Link calendar to Google / Apple', run: () => { location.hash = '#calendar'; setTimeout(openCalLink, 50); } },
    { g: 'Actions', t: 'Add a private booking', run: () => { location.hash = '#leads'; setTimeout(openAddBooking, 50); } },
    { g: 'Actions', t: 'Compose an email', run: () => location.hash = '#outreach/compose' },
    { g: 'Actions', t: 'Edit website text & photos', run: () => location.hash = '#website/edit' },
    { g: 'Actions', t: 'Edit listings', run: () => location.hash = '#website/listings' },
    { g: 'Actions', t: 'Switch light / dark', run: () => $('#themeBtn').click() }]
    .filter(x => !q || x.t.toLowerCase().includes(q));
  const people = q ? S.enq.filter(e => [e.name, e.company, e.email, e.phone, e.categories, e.details].some(v => String(v || '').toLowerCase().includes(q))).slice(0, 8)
    .map(e => ({ g: isPartner(e) ? 'Partners' : 'Briefs', t: nameOf(e), s: ST[e.status || 'new'] && !isPartner(e) ? ST[e.status || 'new'] : 'Partner', run: () => openLead(key(e)) })) : [];
  palItems = [...people, ...nav]; palSel = 0;
  let g = '';
  $('#palRes').innerHTML = palItems.map((x, i) => (x.g !== g ? `<div class="grp">${g = x.g}</div>` : '') + `<div class="it" data-i="${i}" aria-selected="${i === 0}">${esc(x.t)}${x.s ? `<span>${esc(x.s)}</span>` : ''}</div>`).join('') || '<div class="empty">No matches</div>';
  $('#palRes').querySelectorAll('.it').forEach(el => { el.onclick = () => { closePal(); palItems[el.dataset.i].run(); }; el.onmousemove = () => palMark(+el.dataset.i); });
}
function palMark(i) { palSel = i; document.querySelectorAll('#palRes .it').forEach(el => el.setAttribute('aria-selected', +el.dataset.i === i)); document.querySelector(`#palRes .it[data-i="${i}"]`)?.scrollIntoView({ block: 'nearest' }); }
function palKey(e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); palMark(Math.min(palItems.length - 1, palSel + 1)); }
  if (e.key === 'ArrowUp') { e.preventDefault(); palMark(Math.max(0, palSel - 1)); }
  if (e.key === 'Enter' && palItems[palSel]) { const it = palItems[palSel]; closePal(); it.run(); }
}
$('#openPal').addEventListener('click', openPal);
addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && !$('#app').hidden) { e.preventDefault(); $('#pal') ? closePal() : openPal(); } });

boot();
</script>
